[project]
name = "mcplens"
version = "0.1.0"
description = "High-speed diagnostic, auditing, and profiling toolkit for Model Context Protocol (MCP) servers"
readme = "README.md"
authors = [
    { name = "Sunzzx", email = "ayushkandwal2007@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
mcplens = "mcplens.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
